        function renderFieldItem(mKey, valObj) {
            if (!valObj) return '';
            if (typeof valObj === 'string') return `<div class="bg-gray-50 p-3 rounded-2xl border text-sm flex justify-between"><span class="text-gray-500 text-xs">${mKey}</span><span class="font-bold">${valObj}</span></div>`;
            let html = '';
            if (['rasm','rasm_tushish','galereyadan'].includes(valObj.turi)) {
                const files = valObj.files && valObj.files.length ? valObj.files : (valObj.url ? [{ nomi: valObj.nomi, url: valObj.url }] : []);
                if (files.length) {
                    const urls = files.map(f => f.url);
                    let imgs = `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2">`;
                    files.forEach((f, i) => { imgs += `<div class="bg-slate-900 rounded-xl overflow-hidden p-1 text-center cursor-pointer img-thumb" onclick="openImageViewer(${JSON.stringify(urls).replace(/"/g,'&quot;')},${i})"><img src="${f.url}" class="w-full h-32 object-contain rounded-lg"><span class="text-[10px] text-gray-300 truncate block">${f.nomi || 'Rasm'}</span></div>`; });
                    imgs += `</div>`;
                    html = `<div class="mt-1"><span class="text-xs text-indigo-600 font-bold"><i class="fa-regular fa-image mr-1"></i>Rasm:</span>${imgs}</div>`;
                } else html = `<span class="text-xs text-red-500">Rasm yo‘q</span>`;
            } else if (valObj.turi === 'video' && valObj.url) {
                html = `<div class="mt-1"><span class="text-xs text-purple-600 font-bold"><i class="fa-regular fa-video mr-1"></i>Video:</span><div class="bg-black rounded-xl overflow-hidden p-1 mt-1"><video controls class="w-full max-h-64 object-contain"><source src="${valObj.url}"></video></div></div>`;
            } else if (valObj.turi === 'file' && valObj.url) {
                html = `<div class="mt-1"><a href="${valObj.url}" download="${valObj.nomi || 'fayl'}" class="inline-flex items-center gap-2 bg-indigo-50 text-indigo-700 px-4 py-2 rounded-2xl text-xs font-bold hover:bg-indigo-100"><i class="fa-regular fa-download"></i>${valObj.nomi || 'Yuklab olish'}</a></div>`;
            } else if (valObj.turi === 'tanlov' && valObj.multiple && valObj.variants) {
                const badges = valObj.variants.map(v => `<span class="inline-block bg-purple-100 text-purple-700 text-xs px-2 py-0.5 rounded-full mr-1 mb-1">${v}</span>`).join('');
                html = `<div class="mt-1"><span class="text-xs text-purple-600 font-bold">Tanlanganlar:</span><div class="mt-1">${badges}</div></div>`;
            } else {
                const val = valObj.qiymat || '';
                let label = '';
                if (valObj.turi === 'sana') label = '<span class="text-[10px] bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full ml-2">Sana</span>';
                else if (valObj.turi === 'vaqt') label = '<span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full ml-2">Vaqt</span>';
                else if (valObj.turi === 'nomer') label = '<span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full ml-2">Raqam</span>';
                else if (valObj.turi === 'tanlov') label = '<span class="text-[10px] bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full ml-2">Tanlov</span>';
                html = `<span class="font-bold">${val}</span> ${label}`;
            }
            return `<div class="bg-gray-50 p-3 rounded-2xl border text-sm"><span class="text-gray-400 text-xs uppercase font-medium block">${mKey}</span>${html}</div>`;
        }

                    if (f && !searchText.toLowerCase().includes(f)) continue;

                    let qiymatlarHtml = ''; if (a.qiymatlar) for (let mk in a.qiymatlar) qiymatlarHtml += renderFieldItem(mk, a.qiymatlar[mk]);
                    let javobHtml = a.javob ? `<div class="bg-indigo-50/60 border border-indigo-200 p-4 rounded-2xl space-y-1"><div class="flex items-center gap-2 text-indigo-700 font-bold text-xs uppercase"><i class="fa-regular fa-circle-info"></i>Javob:</div><p class="text-sm text-indigo-900 whitespace-pre-wrap">${a.javob}</p></div>` : '';

                list.innerHTML = html;
                document.querySelectorAll('svg.arcv').forEach(svg => { try { JsBarcode(svg, svg.dataset.code, { format: "CODE128", width: 1.2, height: 44, fontSize: 10 }); } catch(e) {} });

                else if (m.turi === 'galereyadan') fields += `<div class="p-3 bg-purple-50/50 rounded-2xl"><input type="file" accept="image/*" multiple data-fid="${mId}" data-ftype="galereyadan" data-req="false" class="edit-ariza-field w-full file-input"></div>`;

                else fields += `<input type="file" data-fid="${mId}" data-ftype="file" data-req="false" class="edit-ariza-field w-full px-4 py-3 border-2 border-indigo-200 rounded-2xl file-input">`;

            const adminKodControls = isAdmin ? `

                        <div class="flex gap-1 mt-1 flex-wrap">
                            <button onclick="saveArizaKod5Manual('${arizaId}')" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">💾 Saqlash</button>
                            <button onclick="regenerateKod5('ariza','${arizaId}')" class="bg-blue-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🔄 Qayta</button>
                            <button onclick="deleteKod5('ariza','${arizaId}')" class="bg-red-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🗑 O'chirish</button>

                        <div class="flex gap-1 mt-1 flex-wrap">
                            <button onclick="saveArizaShtrixManual('${arizaId}')" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">💾 Saqlash</button>
                            <button onclick="regenerateShtrixKod('ariza','${arizaId}')" class="bg-blue-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🔄 Qayta</button>
                            <button onclick="deleteShtrixKod('ariza','${arizaId}')" class="bg-red-600 text-white px-2 py-1 rounded-lg text-[10px] font-bold">🗑 O'chirish</button>
                        </div>
                    </div>
                    <div class="md:col-span-2 text-[10px] text-gray-500 italic"><i class="fa-solid fa-shield-halved mr-1"></i>Faqat admin shtrix va 5 xonali kodni o'zgartira oladi.</div>
                </div>
            ` : `
                ${(showKod5 || showShtrix) ? `
                <div class="grid grid-cols-2 gap-2 bg-amber-50 p-3 rounded-2xl border border-amber-200">
                    ${showKod5 ? `<div><label class="text-[10px] font-bold uppercase text-amber-700">5 xonali kod</label><input type="text" value="${a.kod5 || ''}" class="w-full border-2 readonly-field px-3 py-2 rounded-xl font-bold tracking-widest" readonly></div>` : ''}
                    ${showShtrix ? `<div><label class="text-[10px] font-bold uppercase text-amber-700">Shtrix kod</label><input type="text" value="${a.shtrixKod || ''}" class="w-full border-2 readonly-field px-3 py-2 rounded-xl text-xs" readonly></div>` : ''}

        window.closeModal = function() { document.getElementById('modalContainer').innerHTML = ''; };
        window.saveEditedAriza = async function(arizaId) {
            const arizalar = await getArizalarCached(); const a = arizalar[arizaId]; if (!a) return;
            const inputs = document.querySelectorAll('.edit-ariza-field');
            const checkboxGroups = document.querySelectorAll('.edit-ariza-field.checkbox-group');
            let updated = { ...a.qiymatlar };
            for (let inp of inputs) {
                if (inp.classList.contains('checkbox-group')) continue;
                const fid = inp.dataset.fid, ftype = inp.dataset.ftype, req = inp.dataset.req === 'true';
                if (['rasm','video','file','rasm_tushish','galereyadan'].includes(ftype)) {
                    if (inp.files && inp.files.length) {
                        let files = [];
                        for (let f of inp.files) {
                            try {
                                if (ftype === 'video') {
                                    const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
                                    files.push({ nomi: f.name, url: b64 });
                                } else {
                                    const b64 = await readFileCompressed(f, 900, 900, 0.78);
                                    files.push({ nomi: f.name, url: b64 });
                                }
                            } catch(e) {}
                        }
                        updated[fid] = { turi: ftype, multiple: files.length > 1 || inp.multiple, files, nomi: files[0]?.nomi || '', url: files[0]?.url || '' };
                    }
                } else {
                    if (req && !inp.value.trim()) { alert("Majburiy maydon!"); inp.focus(); return; }
                    if (updated[fid] && typeof updated[fid] === 'object') updated[fid].qiymat = inp.value;
                    else updated[fid] = { turi: ftype, qiymat: inp.value };
                }
            }
            for (let group of checkboxGroups) {
                const fid = group.dataset.fid, req = group.dataset.req === 'true', max = parseInt(group.dataset.max);
                const checked = [...group.querySelectorAll('input[type="checkbox"]:checked')].map(cb => cb.value);
                if (req && checked.length === 0) { alert("Kamida bitta variant tanlang!"); return; }
                if (checked.length > max) { alert(`Ko'pi bilan ${max} ta tanlash mumkin!`); return; }
                updated[fid] = { turi: 'tanlov', multiple: true, qiymat: checked.join(', '), variants: checked };
            }
            await update(ref(db, `arizalar/${arizaId}`), { qiymatlar: updated });
            CACHE.arizalar = null; alert("Tahrirlandi!"); closeModal(); renderArizalarim(document.getElementById('tabContent'));
        };

            function katIcon(k) {
                if (k.rasmUrl) return `<img src="${k.rasmUrl}" class="w-14 h-14 object-cover rounded-xl border flex-shrink-0">`;
                const txt = (k.matn || k.nomi || '').trim();

            }

            function prodRowHtml(catId, mId, data) {
                const m = mahsulotlar[mId];
                if (!m) return `<div class="text-xs text-gray-400 p-1 italic">Mahsulot o'chirilgan: ${mId}</div>`;
                const img = (m.rasmUrls && m.rasmUrls[0]) || m.rasmUrl || '';
                return `<div class="flex items-center gap-2 bg-white p-2 rounded-xl border text-xs">
                    ${img ? `<img src="${img}" class="w-9 h-9 object-contain rounded bg-gray-50 border">` : `<div class="w-9 h-9 bg-gray-100 rounded border"></div>`}
                    <div class="flex-1 min-w-0">
                        <div class="font-bold truncate">${m.nomi}</div>
                        <div class="text-[10px] text-purple-600 font-bold">${m.narx} so'm · ID: ${mId}</div>
                    </div>

                    <button onclick="moveKatProduct('${catId}','${mId}',1)" class="text-gray-600 bg-gray-100 px-2 py-1 rounded-lg font-bold">⬇️</button>
                    <button onclick="removeKatProduct('${catId}','${mId}')" class="text-red-600 bg-red-50 px-2 py-1 rounded-lg font-bold"><i class="fa-regular fa-trash"></i></button>
                </div>`;
            }

            function renderTree(parentId, level) {
                const children = Object.entries(kategoriyalar)
                    .filter(([id, k]) => (k.parentId || '') === parentId)
                    .sort((a, b) => (a[1].tartib || 0) - (b[1].tartib || 0));
                if (!children.length) return '';
                let html = '';
                for (let [id, k] of children) {
                    const prods = k.mahsulotlar || {};
                    const prodEntries = Object.entries(prods).sort((a, b) => (a[1].tartib || 0) - (b[1].tartib || 0));
                    const prodCount = prodEntries.length;
                    const subCount = Object.values(kategoriyalar).filter(x => (x.parentId || '') === id).length;
                    const style = `margin-left: ${level * 16}px;`;
                    html += `
                        <div class="border-2 border-purple-100 rounded-2xl bg-purple-50/30 p-3 space-y-2" style="${style}">
                            <div class="flex items-start gap-2 flex-wrap">
                                ${katIcon(k)}
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-gray-800 flex items-center gap-2 flex-wrap">

                                    ${k.rasmUrl && k.matn ? `<div class="text-[10px] text-gray-500 mt-1 line-clamp-2">${k.matn}</div>` : ''}
                                </div>
                                <div class="flex gap-1 flex-wrap justify-end">
                                    <button onclick="moveKat('${id}',-1)" class="text-gray-700 bg-white border px-2 py-1 rounded-lg text-xs font-bold">⬆️</button>
                                    <button onclick="moveKat('${id}',1)" class="text-gray-700 bg-white border px-2 py-1 rounded-lg text-xs font-bold">⬇️</button>
                                    <button onclick="openKatAddProductModal('${id}')" class="text-emerald-700 bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-lg text-xs font-bold"><i class="fa-solid fa-boxes-stacked mr-1"></i>Mahsulot</button>

                                </div>
                            </div>
                            ${prodCount ? `<div class="space-y-1 pl-2 border-l-4 border-purple-300 ml-2">${prodEntries.map(([mId, p]) => prodRowHtml(id, mId, p)).join('')}</div>` : ''}
                            ${renderTree(id, level + 1)}
                        </div>
                    `;
                }
                return html;
            }

                <div class="bg-white/70 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-purple-100 space-y-6">

                        <h4 class="text-xs font-bold text-gray-700 uppercase">Yangi asosiy kategoriya</h4>
                        <input type="text" id="newKatNomi" placeholder="Kategoriya nomi *" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl bg-white">
                        <textarea id="newKatMatn" rows="2" placeholder="Matn (ixtiyoriy - rasm yuklamasangiz shu matn ko'rinadi)" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl bg-white"></textarea>
                        <div>
                            <label class="text-xs text-gray-500 font-bold">Rasm (ixtiyoriy)</label>
                            <input type="file" accept="image/*" id="newKatRasm" class="w-full border-2 border-purple-200 p-1 rounded-xl bg-white file-input">
                            <div id="newKatRasmPreview" class="mt-2"></div>
                        </div>
                        <button id="addKatBtn" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-6 py-2.5 rounded-2xl font-bold text-xs shadow hover:shadow-lg"><i class="fa-solid fa-plus mr-1"></i>Kategoriya qo'shish</button>
                    </div>

                    <div class="space-y-3">
                        <h4 class="text-sm font-bold text-gray-700">Mavjud kategoriyalar</h4>
                        <div id="katTree">${renderTree('', 0) || '<p class="text-gray-400 text-sm">Kategoriyalar yo\'q</p>'}</div>
                    </div>
                </div>
            `;

            let newRasmUrl = '';
            document.getElementById('newKatRasm').addEventListener('change', async (e) => {
                if (e.target.files[0]) {
                    newRasmUrl = await readFileCompressed(e.target.files[0], 700, 700, 0.8);
                    document.getElementById('newKatRasmPreview').innerHTML = `<img src="${newRasmUrl}" class="w-24 h-24 object-cover rounded-xl border">`;
                }
            });

            document.getElementById('addKatBtn').addEventListener('click', async () => {
                const nomi = document.getElementById('newKatNomi').value.trim();
                if (!nomi) { alert("Nomi kiriting!"); return; }
                const matn = document.getElementById('newKatMatn').value.trim();
                const all = await getKategoriyalar(true);
                const sibs = Object.values(all).filter(x => (x.parentId || '') === '');
                const maxT = sibs.reduce((m, x) => Math.max(m, x.tartib || 0), 0);
                const newId = 'cat_' + Math.floor(10000 + Math.random() * 90000);
                await set(ref(db, `kategoriyalar/${newId}`), { nomi, matn, rasmUrl: newRasmUrl || '', parentId: '', tartib: maxT + 1 });
                CACHE.kategoriyalar = null;
                renderAdminKategoriyalar(container);
            });
        }

        window.openKatModal = async function(katId, parentId) {
            const all = await getKategoriyalar(true);
            const k = katId ? all[katId] : null;
            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto modal-overlay">
                    <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-md space-y-4 border border-purple-100 max-h-[90vh] overflow-y-auto">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-xl font-bold">${katId ? 'Kategoriyani tahrirlash' : (parentId ? 'Ichki kategoriya qo\'shish' : 'Yangi kategoriya')}</h3>
                            <button onclick="closeModal()" class="text-2xl font-bold">&times;</button>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-700 uppercase">Nomi *</label>
                            <input type="text" id="katModalNomi" value="${k?.nomi || ''}" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-700 uppercase">Matn (rasm yo'q bo'lsa ko'rinadi)</label>
                            <textarea id="katModalMatn" rows="3" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl">${k?.matn || ''}</textarea>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-700 uppercase">Rasm (ixtiyoriy)</label>
                            <input type="file" accept="image/*" id="katModalRasm" class="w-full border-2 border-purple-200 p-1 rounded-xl file-input">
                            <div id="katModalRasmPreview" class="mt-2">
                                ${k?.rasmUrl ? `<img src="${k.rasmUrl}" class="w-24 h-24 object-cover rounded-xl border">` : ''}
                            </div>
                            ${k?.rasmUrl ? `<button onclick="window._removeKatImg()" class="text-xs text-red-500 mt-1 font-bold">✕ Rasmni o'chirish</button>` : ''}
                        </div>
                        <div class="flex justify-end gap-2 pt-3 border-t">
                            <button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 rounded-2xl font-bold text-sm">Bekor</button>
                            <button id="katModalSaveBtn" class="px-6 py-2.5 bg-purple-600 text-white rounded-2xl font-bold text-sm shadow">Saqlash</button>
                        </div>
                    </div>
                </div>
            `;
            let newRasmUrl = null;
            let removeImg = false;
            window._removeKatImg = () => {
                removeImg = true;
                newRasmUrl = '';
                document.getElementById('katModalRasmPreview').innerHTML = '';
            };
            document.getElementById('katModalRasm').addEventListener('change', async (e) => {
                if (e.target.files[0]) {
                    newRasmUrl = await readFileCompressed(e.target.files[0], 700, 700, 0.8);
                    removeImg = false;
                    document.getElementById('katModalRasmPreview').innerHTML = `<img src="${newRasmUrl}" class="w-24 h-24 object-cover rounded-xl border">`;
                }
            });
            document.getElementById('katModalSaveBtn').addEventListener('click', async () => {
                const nomi = document.getElementById('katModalNomi').value.trim();
                if (!nomi) { alert("Nom kiriting!"); return; }
                const matn = document.getElementById('katModalMatn').value.trim();
                let finalRasm = k?.rasmUrl || '';
                if (newRasmUrl !== null) finalRasm = newRasmUrl;
                if (removeImg) finalRasm = '';
                if (katId) {
                    await update(ref(db, `kategoriyalar/${katId}`), { nomi, matn, rasmUrl: finalRasm });
                } else {
                    const all2 = await getKategoriyalar(true);
                    const sibs = Object.values(all2).filter(x => (x.parentId || '') === (parentId || ''));
                    const maxT = sibs.reduce((m, x) => Math.max(m, x.tartib || 0), 0);
                    const newId = 'cat_' + Math.floor(10000 + Math.random() * 90000);
                    await set(ref(db, `kategoriyalar/${newId}`), { nomi, matn, rasmUrl: finalRasm, parentId: parentId || '', tartib: maxT + 1 });
                }
                CACHE.kategoriyalar = null;
                closeModal();
                renderAdminKategoriyalar(document.getElementById('tabContent'));
            });
        };

        window.openKatAddProductModal = async function(catId) {
            const all = await getKategoriyalar(true);
            const k = all[catId]; if (!k) return;
            const mahsulotlar = await getMahsulotlarCached(true);
            const existing = k.mahsulotlar || {};
            const modal = document.getElementById('modalContainer');
            let listHtml = '';
            for (let mId in mahsulotlar) {
                const m = mahsulotlar[mId];
                const checked = !!existing[mId];
                const img = (m.rasmUrls && m.rasmUrls[0]) || m.rasmUrl || '';
                listHtml += `
                    <label class="flex items-center gap-2 bg-gray-50 p-2 rounded-xl border cursor-pointer katProdRow" data-search="${(m.nomi + ' ' + mId).toLowerCase()}">
                        <input type="checkbox" class="katProdChk accent-purple-600" value="${mId}" ${checked ? 'checked' : ''}>
                        ${img ? `<img src="${img}" class="w-10 h-10 object-contain rounded border bg-white">` : `<div class="w-10 h-10 bg-gray-200 rounded"></div>`}
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold truncate">${m.nomi}</div>
                            <div class="text-xs text-purple-600">${m.narx} so'm · ID: ${mId}</div>
                        </div>
                    </label>
                `;
            }
            modal.innerHTML = `
                <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto modal-overlay">
                    <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-2xl space-y-4 max-h-[90vh] overflow-y-auto border border-purple-100">
                        <div class="flex justify-between items-center border-b pb-3">
                            <h3 class="text-xl font-bold"><i class="fa-solid fa-boxes-stacked text-purple-500 mr-2"></i>${k.nomi} — Mahsulotlar</h3>
                            <button onclick="closeModal()" class="text-2xl font-bold">&times;</button>
                        </div>
                        <p class="text-xs text-gray-500">Belgilangan mahsulotlar tartibi pastdagi tugmalar orqali almashtiriladi.</p>
                        <input type="text" id="katProdSearch" placeholder="Qidirish..." class="w-full border-2 border-purple-200 px-4 py-2 rounded-2xl">
                        <div id="katProdList" class="space-y-2 max-h-[55vh] overflow-y-auto">${listHtml || '<p class="text-gray-400 text-sm">Mahsulotlar yo\'q</p>'}</div>
                        <div class="flex justify-end gap-2 pt-3 border-t">
                            <button onclick="closeModal()" class="px-5 py-2.5 bg-gray-100 rounded-2xl font-bold text-sm">Bekor</button>
                            <button id="katProdSaveBtn" class="px-6 py-2.5 bg-purple-600 text-white rounded-2xl font-bold text-sm shadow">Saqlash</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('katProdSearch').addEventListener('input', (e) => {
                const f = e.target.value.toLowerCase();
                document.querySelectorAll('.katProdRow').forEach(l => {
                    l.style.display = l.dataset.search.includes(f) ? '' : 'none';
                });
            });
            document.getElementById('katProdSaveBtn').addEventListener('click', async () => {
                const checkedIds = [...document.querySelectorAll('.katProdChk:checked')].map(c => c.value);
                const existingEntries = Object.entries(existing).sort((a, b) => (a[1].tartib || 0) - (b[1].tartib || 0));
                const newObj = {};
                let t = 1;
                for (let [mId] of existingEntries) {
                    if (checkedIds.includes(mId)) newObj[mId] = { tartib: t++ };
                }
                for (let mId of checkedIds) {
                    if (!newObj[mId]) newObj[mId] = { tartib: t++ };
                }
                await update(ref(db, `kategoriyalar/${catId}`), { mahsulotlar: newObj });
                CACHE.kategoriyalar = null;
                closeModal();
                renderAdminKategoriyalar(document.getElementById('tabContent'));
            });
        };

        window.moveKat = async function(catId, dir) {
            const all = await getKategoriyalar(true);
            const k = all[catId]; if (!k) return;
            const parentId = k.parentId || '';
            const siblings = Object.entries(all)
                .filter(([id, x]) => (x.parentId || '') === parentId)
                .sort((a, b) => (a[1].tartib || 0) - (b[1].tartib || 0));
            const idx = siblings.findIndex(([id]) => id === catId);
            if (idx === -1) return;
            const target = idx + dir;
            if (target < 0 || target >= siblings.length) return;
            const [aId, aK] = siblings[idx];
            const [bId, bK] = siblings[target];
            const aT = aK.tartib || idx + 1;
            const bT = bK.tartib || target + 1;
            await update(ref(db, `kategoriyalar/${aId}`), { tartib: bT });
            await update(ref(db, `kategoriyalar/${bId}`), { tartib: aT });
            CACHE.kategoriyalar = null;
            renderAdminKategoriyalar(document.getElementById('tabContent'));
        };

        window.deleteKat = async function(catId) {
            const all = await getKategoriyalar(true);
            function collectDescendants(id) {
                let result = [id];
                for (let cid in all) {
                    if ((all[cid].parentId || '') === id) result = result.concat(collectDescendants(cid));
                }
                return result;
            }
            const toDelete = collectDescendants(catId);
            if (!confirm(`${toDelete.length} ta kategoriya (ichki kategoriyalar bilan) o'chirilsinmi?`)) return;
            for (let id of toDelete) await remove(ref(db, `kategoriyalar/${id}`));
            CACHE.kategoriyalar = null;
            renderAdminKategoriyalar(document.getElementById('tabContent'));
        };

        window.moveKatProduct = async function(catId, mId, dir) {
            const all = await getKategoriyalar(true);
            const k = all[catId]; if (!k || !k.mahsulotlar) return;
            const entries = Object.entries(k.mahsulotlar).sort((a, b) => (a[1].tartib || 0) - (b[1].tartib || 0));
            const idx = entries.findIndex(([id]) => id === mId);
            if (idx === -1) return;
            const target = idx + dir;
            if (target < 0 || target >= entries.length) return;
            const aId = entries[idx][0], bId = entries[target][0];
            const newObj = { ...k.mahsulotlar };
            newObj[aId] = { ...newObj[aId], tartib: target + 1 };
            newObj[bId] = { ...newObj[bId], tartib: idx + 1 };
            await update(ref(db, `kategoriyalar/${catId}`), { mahsulotlar: newObj });
            CACHE.kategoriyalar = null;
            renderAdminKategoriyalar(document.getElementById('tabContent'));
        };

        window.removeKatProduct = async function(catId, mId) {
            if (!confirm("Mahsulot kategoriyadan olib tashlansinmi?")) return;
            await remove(ref(db, `kategoriyalar/${catId}/mahsulotlar/${mId}`));
            CACHE.kategoriyalar = null;
            renderAdminKategoriyalar(document.getElementById('tabContent'));
        };

        initSystem();
    </script>
</body>
</html>
