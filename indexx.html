        function playBeep(times = 3, freq = 1200, dur = 100, gap = 80) {
            try {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (!Ctx) return;
                const ctx = new Ctx();
                let start = ctx.currentTime;
                for (let i = 0; i < times; i++) {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.0001, start);
                    gain.gain.exponentialRampToValueAtTime(0.35, start + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, start + dur / 1000);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(start);
                    osc.stop(start + dur / 1000);
                    start += (dur + gap) / 1000;
                }
                setTimeout(() => { try { ctx.close(); } catch (e) {} }, (times * (dur + gap)) + 300);
            } catch (e) { console.warn('Beep error:', e); }
        }

        function parseVariantlar(variantlarStr) {
            if (!variantlarStr) return [];
            if (typeof variantlarStr === 'string' && variantlarStr.trim().startsWith('[')) {
                try {
                    const arr = JSON.parse(variantlarStr);
                    return arr.map(v => ({
                        nomi: v.nomi || '',
                        narx: parseInt(v.narx) || 0,
                        soni: (v.soni !== undefined && v.soni !== null && v.soni !== '') ? parseInt(v.soni) : null,
                        rasmUrl: v.rasmUrl || ''
                    })).filter(v => v.nomi);
                } catch(e) {}
            }
            return variantlarStr.split(',').map(v => {
                const trimmed = v.trim();
                if (!trimmed) return null;
                const parts = trimmed.split(':');
                if (parts.length >= 2) {
                    return { nomi: parts[0].trim(), narx: parseInt(parts[1].trim()) || 0, soni: null, rasmUrl: '' };
                }
                return { nomi: trimmed, narx: 0, soni: null, rasmUrl: '' };
            }).filter(Boolean);
        }

        function serializeVariantlar(variants) {
            return JSON.stringify(variants.map(v => ({
                nomi: v.nomi || '',
                narx: parseInt(v.narx) || 0,
                soni: (v.soni !== undefined && v.soni !== null && v.soni !== '') ? parseInt(v.soni) : null,
                rasmUrl: v.rasmUrl || ''
            })));
        }

        function getVariantStock(xususiyat, variantNomi) {
            if (!xususiyat) return null;
            const parsed = parseVariantlar(xususiyat.variantlar);
            const found = parsed.find(v => v.nomi === variantNomi);
            return found ? found.soni : null;
        }

        function getAvailableQtyForSelection(mahsulot, selectedVars) {
            let avail = null;
            if (!mahsulot.xususiyatlar || !mahsulot.xususiyatlar.length) return parseInt(mahsulot.soni) || 0;
            mahsulot.xususiyatlar.forEach((x, xi) => {
                const vNomi = selectedVars ? selectedVars[xi] : null;
                if (!vNomi) return;
                const parsed = parseVariantlar(x.variantlar);
                const found = parsed.find(v => v.nomi === vNomi);
                if (found && found.soni !== null && found.soni !== undefined) {
                    const s = parseInt(found.soni) || 0;
                    if (avail === null || s < avail) avail = s;
                }
            });
            if (avail === null) return parseInt(mahsulot.soni) || 0;
            return avail;
        }

        function getVariantNarx(mahsulot, tanlanganVariantlar, xususiyatIdx, variantNomi) {
            if (!mahsulot.xususiyatlar || !mahsulot.xususiyatlar[xususiyatIdx]) return 0;
            const x = mahsulot.xususiyatlar[xususiyatIdx];
            const parsed = parseVariantlar(x.variantlar);
            const found = parsed.find(v => v.nomi === variantNomi);
            return found ? found.narx : 0;
        }

        function calculateMahsulotNarx(mahsulot, tanlanganVariantlar) {
            let baseNarx = parseInt(mahsulot.narx) || 0;
            if (!mahsulot.xususiyatlar || !mahsulot.xususiyatlar.length) return baseNarx;
            let jami = baseNarx;
            mahsulot.xususiyatlar.forEach((x, xi) => {
                const variantNomi = tanlanganVariantlar[xi];
                if (!variantNomi) return;
                const parsed = parseVariantlar(x.variantlar);
                const found = parsed.find(v => v.nomi === variantNomi);
                if (found && found.narx > 0) { jami = found.narx; }
            });
            return jami;
        }

        async function readFileCompressed(file, maxW = 900, maxH = 900, quality = 0.78) {
            if (!file.type.startsWith('image/')) {
                return new Promise((res, rej) => {
                    const r = new FileReader();
                    r.onload = () => res(r.result);
                    r.onerror = rej;
                    r.readAsDataURL(file);
                });
            }
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let w = img.width, h = img.height;
                        if (w > maxW || h > maxH) {
                            const ratio = Math.min(maxW / w, maxH / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        const c = document.createElement('canvas');
                        c.width = w; c.height = h;
                        const ctx = c.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(c.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function readFilesCompressed(fileList) {
            return Promise.all([...fileList].map(f => readFileCompressed(f)));
        }

            const usersSnap = await get(ref(db, 'users'));
            if (!usersSnap.exists()) {
                const newId = Math.floor(100000 + Math.random() * 900000).toString();

                localStorage.setItem('app_profiles', JSON.stringify(profiles));
                currentProfileId = newId; localStorage.setItem('current_profile_id', currentProfileId);
            } else if (profiles.length === 0) {
                const users = usersSnap.val(); const firstId = Object.keys(users)[0];
                profiles.push(users[firstId]); localStorage.setItem('app_profiles', JSON.stringify(profiles));
                currentProfileId = firstId; localStorage.setItem('current_profile_id', currentProfileId);
            }
            if (currentProfileId) {

            if (snap.exists()) { CACHE.user = snap.val(); return CACHE.user; }

        function sortMaydonlar(maydonlar) {
            if (!maydonlar) return [];
            return Object.entries(maydonlar).sort((a, b) => {
                const oA = a[1].tartib !== undefined ? a[1].tartib : 0;
                const oB = b[1].tartib !== undefined ? b[1].tartib : 0;
                return oA - oB;
            });

        window.openImageViewer = function(urls, startIdx = 0) {
            if (!urls || !urls.length) return;
            let idx = startIdx;
            const modal = document.getElementById('modalContainer');
            function draw() {
                modal.innerHTML = `
                    <div class="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-4 modal-overlay" onclick="if(event.target===this)closeModal()">
                        <button onclick="closeModal()" class="absolute top-4 right-4 text-white text-3xl w-11 h-11 rounded-full bg-white/10 hover:bg-white/20">&times;</button>
                        ${urls.length > 1 ? `<button onclick="event.stopPropagation();window._imgPrev()" class="absolute left-2 md:left-6 text-white text-5xl w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center">‹</button>` : ''}
                        <img src="${urls[idx]}" class="max-w-full max-h-[88vh] object-contain rounded-2xl shadow-2xl" onclick="event.stopPropagation()">
                        ${urls.length > 1 ? `<button onclick="event.stopPropagation();window._imgNext()" class="absolute right-2 md:right-6 text-white text-5xl w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center">›</button>` : ''}
                        ${urls.length > 1 ? `<div class="absolute bottom-6 left-1/2 -translate-x-1/2 text-white text-sm bg-black/60 px-4 py-1 rounded-full">${idx+1} / ${urls.length}</div>` : ''}
                    </div>
                `;
            }
            window._imgPrev = () => { idx = (idx - 1 + urls.length) % urls.length; draw(); };
            window._imgNext = () => { idx = (idx + 1) % urls.length; draw(); };
            draw();
        };

        function getProductImages(m) {
            if (m.rasmUrls && Array.isArray(m.rasmUrls) && m.rasmUrls.length) return m.rasmUrls.filter(Boolean);
            if (m.rasmUrl) return [m.rasmUrl];

        // ==================== KATEGORIYALAR (FOYDALANUVCHI) - UZUM MARKET KO'RINISHIDA ====================

                } else {

                    media = `<div class="w-full h-32 bg-purple-100 rounded-2xl mb-2 flex items-center justify-center text-purple-700 font-bold text-center p-3 overflow-hidden">${t.slice(0, 80)}</div>`;

            }

            const rootCats = Object.entries(kategoriyalar)
                .filter(([id, k]) => (k.parentId || '') === '')
                .sort((a, b) => (a[1].tartib || 0) - (b[1].tartib || 0));

        // ========== KATEGORIYA KO'RISH: ICHKI KATEGORIYA YOKI UZUM MARKET USLUBIDA MAHSULOTLAR ==========

            const kategoriyalar = await getKategoriyalar(true);
            const mahsulotlar = await getMahsulotlarCached(true);

            const subcats = Object.entries(kategoriyalar)
                .filter(([id, x]) => (x.parentId || '') === catId)
                .sort((a, b) => (a[1].tartib || 0) - (b[1].tartib || 0));

            const directProds = Object.entries(k.mahsulotlar || {})
                .sort((a, b) => (a[1].tartib || 0) - (b[1].tartib || 0));

            let subHtml = '';

                            const cnt = Object.keys(c.mahsulotlar || {}).length;

                            else media = `<div class="w-full h-20 bg-purple-100 rounded-xl mb-1 flex items-center justify-center text-purple-700 font-bold text-[10px] text-center p-1 overflow-hidden">${(c.matn || c.nomi).slice(0, 50)}</div>`;
                            return `<div onclick="openKatView('${id}')" class="cursor-pointer bg-gray-50 p-2 rounded-2xl border hover:shadow transition">
                                ${media}
                                <div class="text-xs font-bold truncate">${c.nomi}</div>
                                <div class="text-[10px] text-purple-600 font-bold">${cnt} mahsulot</div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            // ==== UZUM MARKET USLUBIDA MAHSULOTLAR ====
            let prodHtml = '';
            if (directProds.length) {
                // Variant tanlash uchun global state
                if (!window._selectedVariants) window._selectedVariants = {};

                // Barcha mahsulotlar uchun variantlarni boshlang'ich tanlash
                directProds.forEach(([mId, p]) => {
                    const m = mahsulotlar[mId];
                    if (!m) return;
                    if (!window._selectedVariants[mId]) window._selectedVariants[mId] = {};
                    if (m.xususiyatlar && m.xususiyatlar.length) {
                        m.xususiyatlar.forEach((x, xi) => {
                            if (window._selectedVariants[mId][xi]) return;
                            const parsed = parseVariantlar(x.variantlar);
                            const firstAvail = parsed.find(v => v.soni === null || v.soni === undefined || v.soni > 0) || parsed[0];
                            if (firstAvail) window._selectedVariants[mId][xi] = firstAvail.nomi;
                        });
                    }
                });

                prodHtml = `<div class="space-y-3"><h3 class="font-bold text-xs text-gray-500 uppercase">Mahsulotlar (${directProds.length})</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="katProdGrid">
                        ${directProds.map(([mId]) => {
                            const m = mahsulotlar[mId]; if (!m) return '';
                            const imgs = getProductImages(m);
                            const rasm = imgs.length
                                ? `<img src="${imgs[0]}" class="w-full h-44 object-contain bg-gray-50 rounded-2xl img-thumb cursor-pointer" onclick="event.stopPropagation();openProductFullScreen('${mId}')">`
                                : `<div class="w-full h-44 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-300"><i class="fa-solid fa-image text-4xl"></i></div>`;
                            const chegirma = m.chegirma ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">-${m.chegirma}%</span>` : '';
                            const eskiNarx = m.eskiNarx ? `<span class="text-xs text-gray-400 line-through">${m.eskiNarx} so'm</span>` : '';
                            const soni = parseInt(m.soni) || 0;

                            const selectedVars = window._selectedVariants[mId] || {};
                            const availableQty = getAvailableQtyForSelection(m, selectedVars);
                            const tugadi = availableQty <= 0 && soni <= 0;
                            const ozQoldi = availableQty > 0 && availableQty <= 2;
                            let stockHtml = '';
                            if (tugadi) stockHtml = `<span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">Tugadi</span>`;
                            else if (ozQoldi) stockHtml = `<span class="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-bold">${availableQty} dona qoldi</span>`;
                            else stockHtml = `<span class="text-xs bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">${availableQty} dona</span>`;
                            const btnDisabled = tugadi ? 'disabled opacity-50 cursor-not-allowed' : '';
                            const imgsCount = imgs.length > 1 ? `<span class="absolute top-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full"><i class="fa-regular fa-images mr-1"></i>${imgs.length}</span>` : '';

                            let xususiyatlarHtml = '';
                            if (m.xususiyatlar && m.xususiyatlar.length) {
                                xususiyatlarHtml = m.xususiyatlar.map((x, xi) => {
                                    // Uzum marketdagi kabi variant tugmalarini render qilish
                                    return renderVariantControls(m, x, xi, mId, selectedVars[xi], 'selectVariant');
                                }).join('');
                            }
                            const curNarx = calculateMahsulotNarx(m, selectedVars);
                            return `
                                <div class="product-card relative border border-gray-100 rounded-3xl p-4 bg-white shadow-sm space-y-3">
                                    ${chegirma}${imgsCount}
                                    <div onclick="openProductFullScreen('${mId}')" class="cursor-pointer">${rasm}</div>
                                    <div class="space-y-1">
                                        <div class="flex items-center justify-between gap-1">
                                            <span class="text-[10px] font-bold text-gray-400">ID: ${mId}</span>
                                            ${stockHtml}
                                        </div>
                                        <h3 class="font-bold text-gray-800 line-clamp-2 min-h-[2.5rem] cursor-pointer" onclick="openProductFullScreen('${mId}')">${m.nomi}</h3>
                                        <p class="text-xs text-gray-500 line-clamp-2">${m.tavsif || ''}</p>
                                    </div>
                                    ${xususiyatlarHtml}
                                    <div class="flex items-end justify-between gap-2 mt-2">
                                        <div>
                                            <div class="text-lg font-extrabold text-purple-700" id="narx_display_${mId}">${curNarx.toLocaleString()} so'm</div>
                                            ${eskiNarx}
                                        </div>
                                        <div class="flex gap-1">
                                            <button onclick="event.stopPropagation();addToCart('${mId}')" ${btnDisabled} class="bg-gradient-to-r from-amber-500 to-orange-500 text-white px-3 py-2 rounded-2xl text-xs font-bold shadow hover:shadow-lg ${btnDisabled}"><i class="fa-solid fa-cart-plus"></i></button>
                                            <button onclick="event.stopPropagation();openBuyurtmaModal('${mId}')" ${btnDisabled} class="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-3 py-2 rounded-2xl text-xs font-bold shadow hover:shadow-lg ${btnDisabled}"><i class="fa-solid fa-bolt"></i> Buyurtma</button>
                                            <button onclick="event.stopPropagation();openFikrlarModal('${mId}')" class="bg-pink-100 text-pink-700 px-3 py-2 rounded-2xl text-xs font-bold shadow hover:shadow-lg"><i class="fa-regular fa-comment-dots"></i></button>
                                        </div>
                                    </div>
                                </div>
                            `;

                    </div>
                </div>`;

            const modal = document.getElementById('modalContainer');
            modal.innerHTML = `

                            <div class="flex items-center gap-3 min-w-0">
                                ${k.rasmUrl ? `<img src="${k.rasmUrl}" class="w-16 h-16 object-cover rounded-2xl border flex-shrink-0">` : ''}
                                <div class="min-w-0">
                                    <h3 class="text-2xl font-bold text-gray-800 truncate">${k.nomi}</h3>
                                    ${k.matn ? `<p class="text-xs text-gray-600 mt-1 whitespace-pre-wrap">${k.matn}</p>` : ''}
                                </div>
                            </div>
                            <button onclick="closeModal()" class="text-2xl font-bold text-gray-400 hover:text-gray-700">&times;</button>
                        </div>
                        ${subHtml}
                        ${prodHtml}
                        ${(!subHtml && !prodHtml) ? '<p class="text-gray-400 text-center py-8">Bu kategoriyada mahsulotlar yo\'q</p>' : ''}
                    </div>
                </div>
            `;
        };

        // ==================== UZUM MARKET (asosiy bo'lim) ====================
        function renderVariantControls(m, x, xi, mId, selectedVarName, prefix = 'selectVariant') {
            const parsed = parseVariantlar(x.variantlar);
            if (!parsed.length) return '';
            const hasImages = parsed.some(v => v.rasmUrl);
            if (hasImages) {
                const cards = parsed.map(v => {
                    const isSel = selectedVarName === v.nomi;
                    const outOfStock = (v.soni !== null && v.soni !== undefined && v.soni <= 0);
                    const stockBadge = (v.soni !== null && v.soni !== undefined && v.soni > 0) ? `<span class="variant-stock-badge" style="background:#10b981">${v.soni}</span>` : (outOfStock ? `<span class="variant-stock-badge">0</span>` : '');
                    return `<div class="variant-img-card ${isSel ? 'selected' : ''} ${outOfStock ? 'disabled' : ''}" data-mahsulot-id="${mId}" data-xus-idx="${xi}" data-variant="${v.nomi}" onclick="${outOfStock ? '' : prefix}(this)">
                        ${stockBadge}
                        ${v.rasmUrl ? `<img src="${v.rasmUrl}">` : `<div style="width:100%;height:60px;background:#e5e7eb;border-radius:10px"></div>`}
                        <div class="vlabel">${v.nomi}${v.narx > 0 ? `<br><span style="color:#7c3aed">${v.narx.toLocaleString()}</span>` : ''}</div>
                    </div>`;
                }).join('');
                return `<div class="mt-2"><div class="text-xs font-bold text-gray-500 mb-1">${x.nomi}:</div><div class="flex gap-2 overflow-x-auto pb-2">${cards}</div></div>`;
            } else {
                const btns = parsed.map((v, vi) => {
                    const isSel = selectedVarName === v.nomi || (!selectedVarName && vi === 0);
                    const outOfStock = (v.soni !== null && v.soni !== undefined && v.soni <= 0);
                    const stockText = (v.soni !== null && v.soni !== undefined) ? ` <span style="font-size:9px;color:${outOfStock?'#ef4444':'#10b981'};font-weight:800">(${v.soni})</span>` : '';
                    const narxText = v.narx > 0 ? `<span class="variant-price">${v.narx.toLocaleString()} so'm</span>` : '';
                    return `<button type="button" class="variant-btn ${isSel ? 'selected' : ''} ${outOfStock ? 'disabled' : ''}" data-xus-idx="${xi}" data-variant="${v.nomi}" data-narx="${v.narx}" data-mahsulot-id="${mId}" onclick="${outOfStock ? '' : prefix}(this)">${v.nomi}${stockText}${narxText}</button>`;
                }).join('');
                return `<div class="mt-2"><span class="text-xs font-bold text-gray-500">${x.nomi}:</span><div class="flex flex-wrap gap-1.5 mt-1">${btns}</div></div>`;
            }
        }

        async function renderUzumMarket(container) {

                    const m = mahsulotlar[mId];

                    if (f && !(`${m.nomi} ${m.tavsif || ''} ${m.narx || ''} ${mId}`.toLowerCase().includes(f))) continue;
                    found = true;
                    const imgs = getProductImages(m);
                    const rasm = imgs.length
                        ? `<img src="${imgs[0]}" class="w-full h-44 object-contain bg-gray-50 rounded-2xl img-thumb cursor-pointer" onclick="event.stopPropagation();openProductFullScreen('${mId}')">`
                        : `<div class="w-full h-44 bg-gray-100 rounded-2xl flex items-center justify-center text-gray-300"><i class="fa-solid fa-image text-4xl"></i></div>`;
                    const chegirma = m.chegirma ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">-${m.chegirma}%</span>` : '';
                    const eskiNarx = m.eskiNarx ? `<span class="text-xs text-gray-400 line-through">${m.eskiNarx} so'm</span>` : '';
                    const soni = parseInt(m.soni) || 0;

                    if (!window._selectedVariants[mId]) window._selectedVariants[mId] = {};
                    if (m.xususiyatlar && m.xususiyatlar.length) {
                        m.xususiyatlar.forEach((x, xi) => {
                            if (window._selectedVariants[mId][xi]) return;
                            const parsed = parseVariantlar(x.variantlar);
                            const firstAvail = parsed.find(v => v.soni === null || v.soni === undefined || v.soni > 0) || parsed[0];
                            if (firstAvail) window._selectedVariants[mId][xi] = firstAvail.nomi;
                        });
                    }

                    const selectedVars = window._selectedVariants[mId] || {};
                    const availableQty = getAvailableQtyForSelection(m, selectedVars);
                    const tugadi = availableQty <= 0 && soni <= 0;
                    const ozQoldi = availableQty > 0 && availableQty <= 2;
                    let stockHtml = '';

            window._selectedVariants[mId][xusIdx] = variantNomi;

            updateMahsulotNarxDisplay(mId);
            const mahsulotlar = CACHE.mahsulotlar || {};

                    const imgEl = document.getElementById('mainProductImg');
                    if (imgEl) imgEl.src = found.rasmUrl;

                const avail = getAvailableQtyForSelection(m, window._selectedVariants[mId]);

        async function updateFullViewNarx(mId) {
            const mahsulotlar = await getMahsulotlarCached();
            const m = mahsulotlar[mId];
            if (!m) return;
            const selectedVars = window._selectedVariants?.[mId] || {};
            const yangiNarx = calculateMahsulotNarx(m, selectedVars);
            const el = document.getElementById('fullNarxDisplay');
            if (el) {
                el.textContent = yangiNarx.toLocaleString() + " so'm";
                el.classList.remove('price-updated');

        window.submitFikr = async function(mId) {
            const user = await getCurrentUser(); if (!user) { alert("Tizimga kiring!"); return; }
            const matn = document.getElementById('fikrMatn').value.trim();
            const rasmInput = document.getElementById('fikrRasm');
            if (!matn) { alert("Fikr matnini kiriting!"); return; }
            let rasmUrl = '';
            if (rasmInput.files && rasmInput.files[0]) rasmUrl = await readFileCompressed(rasmInput.files[0], 800, 800, 0.75);
            const fId = 'f_' + Math.floor(10000 + Math.random() * 90000);
            const d = new Date();
            const sana = `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            const yangiFikr = { id: fId, userId: user.id, matn, rasmUrl, sana, adminJavob: '' };
            if (!CACHE.fikrlar) CACHE.fikrlar = {};
            if (!CACHE.fikrlar[mId]) CACHE.fikrlar[mId] = {};
            CACHE.fikrlar[mId][fId] = yangiFikr;
            closeModal(); openProductFullScreen(mId);
            showToast("Fikr qo'shildi!");
            try { await set(ref(db, `fikrlar/${mId}/${fId}`), yangiFikr); }
            catch(e) { alert("Xatolik: " + e.message); CACHE.fikrlar = null; }
        };

        window.deleteFikr = async function(mId, fId) {
            if (!confirm("Fikr o'chirilsinmi?")) return;
            if (CACHE.fikrlar && CACHE.fikrlar[mId]) delete CACHE.fikrlar[mId][fId];
            closeModal(); openProductFullScreen(mId);
            showToast("O'chirildi!");
            try { await remove(ref(db, `fikrlar/${mId}/${fId}`)); }
            catch(e) { alert("Xatolik: " + e.message); CACHE.fikrlar = null; }
        };

        window.openFikrlarModal = function(mId) { openProductFullScreen(mId); };

        function getCartQtyForVariant(mId, selectedVars) {
            let total = 0;
            for (let k in savat) {
                const it = savat[k];
                const itMId = it.mahsulotId || k.split('_')[0];
                if (itMId !== mId) continue;
                const itVars = it.tanlanganVariantlar || {};
                let same = true;
                for (let xi in selectedVars) {
                    if (itVars[xi] !== selectedVars[xi]) { same = false; break; }
                }
                if (same) total += parseInt(it.soni) || 0;
            }
            return total;
        }

        window.addToCart = async function(mId) {
            const mahsulotlar = await getMahsulotlarCached();
            const m = mahsulotlar[mId]; if (!m) return;
            const selectedVars = window._selectedVariants?.[mId] || {};
            const avail = getAvailableQtyForSelection(m, selectedVars);
            if (avail <= 0) { alert("Bu variant omborda tugagan!"); return; }
            const inCart = getCartQtyForVariant(mId, selectedVars);
            if (inCart + 1 > avail) { alert(`Bu variantdan omborda ${avail} dona qolgan. Savatda: ${inCart}`); return; }

            let variantText = '';
            let finalNarx = calculateMahsulotNarx(m, selectedVars);
            if (m.xususiyatlar && m.xususiyatlar.length) {
                const parts = m.xususiyatlar.map((x, xi) => {
                    const val = selectedVars[xi];
                    return val ? `${x.nomi}: ${val}` : '';
                }).filter(Boolean);
                variantText = parts.join(', ');
            }
            const key = mId + (variantText ? '_' + variantText : '');
            savat[key] = {
                soni: (parseInt(savat[key]?.soni) || 0) + 1,
                nomi: m.nomi,
                narx: finalNarx,
                asosiyNarx: parseInt(m.narx) || 0,
                mahsulotId: mId,
                turi: m.turi || 'oddiy',
                variantlar: variantText,
                tanlanganVariantlar: JSON.parse(JSON.stringify(selectedVars))
            };
            savatSelected[key] = true;
            saveSavat(); saveSavatSelected();
            alert(`Savatga qo'shildi: ${m.nomi}${variantText ? ' (' + variantText + ')' : ''}\nNarx: ${finalNarx.toLocaleString()} so'm`);
        };

        // ============= SAVAT =============
        async function renderSavat(container) {
            const user = await getCurrentUser(); if (!user) return;
            const mahsulotlar = await getMahsulotlarCached(true);
            for (let k in savat) {
                const mId = savat[k].mahsulotId || k.split('_')[0];
                if (!mahsulotlar[mId]) { delete savat[k]; delete savatSelected[k]; }
            }
            for (let k in savatSelected) { if (!savat[k]) delete savatSelected[k]; }
            saveSavat(); saveSavatSelected();

            container.innerHTML = `
                <div class="bg-white/70 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-amber-100 space-y-4">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-800"><i class="fa-solid fa-cart-shopping text-amber-500 mr-3"></i>Savat</h2>

                        </div>
                        <div class="flex gap-2 flex-wrap">
                            <button id="selectAllCartBtn" class="text-xs bg-emerald-100 text-emerald-700 px-4 py-2 rounded-2xl font-bold hover:bg-emerald-200 transition"><i class="fa-solid fa-check-double mr-1"></i>Hammasini tanlash</button>
                            <button id="unselectAllCartBtn" class="text-xs bg-gray-100 text-gray-700 px-4 py-2 rounded-2xl font-bold hover:bg-gray-200 transition"><i class="fa-regular fa-circle-xmark mr-1"></i>Bekor qilish</button>
                        </div>
                    </div>
                    <div id="savatList" class="space-y-3"></div>
                    <div id="savatFooter"></div>
                </div>
            `;
            const list = document.getElementById('savatList');
            const footer = document.getElementById('savatFooter');

            function draw() {
                let html = '';
                let jamiSelected = 0, countSelected = 0, jamiAll = 0, countAll = 0;

                for (let key in savat) {
                    const it = savat[key];
                    const mId = it.mahsulotId || key.split('_')[0];
                    const m = mahsulotlar[mId]; if (!m) continue;
                    const sum = (it.narx || 0) * (it.soni || 0);
                    jamiAll += sum; countAll += it.soni || 0;
                    const isChecked = !!savatSelected[key];
                    if (isChecked) { jamiSelected += sum; countSelected += it.soni || 0; }

                    const imgs = getProductImages(m);
                    let displayImg = imgs[0] || '';
                    if (it.tanlanganVariantlar && m.xususiyatlar) {
                        for (let xi in it.tanlanganVariantlar) {
                            const x = m.xususiyatlar[xi]; if (!x) continue;
                            const parsed = parseVariantlar(x.variantlar);
                            const f = parsed.find(v => v.nomi === it.tanlanganVariantlar[xi]);
                            if (f && f.rasmUrl) { displayImg = f.rasmUrl; break; }
                        }
                    }
                    const rasm = displayImg ? `<img src="${displayImg}" class="w-20 h-20 object-contain bg-gray-50 rounded-xl border img-thumb" onclick="openImageViewer(${JSON.stringify([displayImg]).replace(/"/g,'&quot;')},0)">` : `<div class="w-20 h-20 bg-gray-100 rounded-xl flex items-center justify-center"><i class="fa-solid fa-image text-gray-300"></i></div>`;
                    const maxSoni = parseInt(m.soni) || 0;
                    const availVar = getAvailableQtyForSelection(m, it.tanlanganVariantlar || {});
                    const variantText = it.variantlar ? `<p class="text-xs text-purple-600 font-medium">${it.variantlar}</p>` : '';

                    html += `
                        <div class="border-2 ${isChecked ? 'cart-selected' : 'border-gray-200'} p-4 rounded-3xl bg-white shadow-sm flex flex-col md:flex-row gap-3 items-start md:items-center transition">
                            <label class="flex items-center cursor-pointer flex-shrink-0 pt-1 md:pt-0">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleCartSelection('${key}')" class="w-6 h-6 accent-emerald-600 cursor-pointer">
                            </label>
                            ${rasm}
                            <div class="flex-1 space-y-1">
                                <h3 class="font-bold text-gray-800">${m.nomi}</h3>
                                <p class="text-xs text-gray-500">ID: ${mId} · Omborda: ${availVar} dona (variant)</p>
                                ${variantText}
                                <p class="text-sm font-extrabold text-purple-700">${it.narx.toLocaleString()} so'm × ${it.soni}</p>
                                <p class="text-xs text-gray-600">Jami: <b>${sum.toLocaleString()} so'm</b></p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="changeCartQty('${key}',-1)" class="bg-gray-100 text-gray-700 w-9 h-9 rounded-full font-bold hover:bg-gray-200">−</button>
                                <span class="w-8 text-center font-bold">${it.soni}</span>
                                <button onclick="changeCartQty('${key}',1)" class="bg-gray-100 text-gray-700 w-9 h-9 rounded-full font-bold hover:bg-gray-200">+</button>
                                <button onclick="removeFromCart('${key}')" class="bg-red-50 text-red-600 px-3 py-2 rounded-2xl font-bold text-xs hover:bg-red-100 ml-2"><i class="fa-regular fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }

        async function decreaseVariantStock(mId, tanlanganVariantlar, qty) {
            if (!tanlanganVariantlar || !Object.keys(tanlanganVariantlar).length) return;
            const mSnap = await get(ref(db, `mahsulotlar/${mId}`));
            if (!mSnap.exists()) return;
            const m = mSnap.val();
            if (!m.xususiyatlar || !m.xususiyatlar.length) return;
            const newXus = JSON.parse(JSON.stringify(m.xususiyatlar));
            let changed = false;
            for (let xi in tanlanganVariantlar) {
                const x = newXus[xi]; if (!x) continue;
                const parsed = parseVariantlar(x.variantlar);
                const found = parsed.find(v => v.nomi === tanlanganVariantlar[xi]);
                if (found && found.soni !== null && found.soni !== undefined) {
                    found.soni = Math.max(0, (parseInt(found.soni) || 0) - qty);
                    newXus[xi] = { ...x, variantlar: serializeVariantlar(parsed) };
                    changed = true;
                }
            }
            if (changed) {
                await update(ref(db, `mahsulotlar/${mId}`), { xususiyatlar: newXus });
                CACHE.mahsulotlar = null;
            }
        }

        async function submitCheckout(selectedKeys) {
            const user = await getCurrentUser(); if (!user) return;
            if (!selectedKeys || !selectedKeys.length) { alert("Mahsulot tanlanmagan!"); return; }
            const mahsulotlar = await getMahsulotlarCached(true);
            for (let key of selectedKeys) {
                const it = savat[key];
                const mId = it.mahsulotId || key.split('_')[0];
                const m = mahsulotlar[mId]; if (!m) { alert(`Mahsulot o'chirilgan: ${mId}`); return; }
                const avail = getAvailableQtyForSelection(m, it.tanlanganVariantlar || {});
                if (avail < it.soni) { alert(`Omborda yetarli emas: ${m.nomi}`); return; }
            }
            const inputs = document.querySelectorAll('.co-field');
            let data = {}; let tel = '', manzil = '', izoh = '';
            for (let inp of inputs) {
                const fid = inp.dataset.fid, ftype = inp.dataset.ftype, req = inp.dataset.req === 'true';
                const v = (inp.value || '').trim();
                if (req && !v) { alert(`Majburiy maydon: ${fid}`); inp.focus(); return; }
                data[fid] = { turi: ftype, qiymat: v };
                if (fid === 'tel' || ftype === 'tel') tel = v;
                if (fid === 'manzil' || ftype === 'manzil') manzil = v;
                if (fid === 'izoh' || ftype === 'izoh') izoh = v;
            }
            const hSnap = await get(ref(db, 'holatlar')); const holatlar = hSnap.exists() ? hSnap.val() : {};
            let defHolat = 'Yangi', defRangi = 'background:#dbeafe;color:#1e40af;';
            const firstH = Object.keys(holatlar)[0]; if (firstH) { defHolat = holatlar[firstH].yozuv; defRangi = holatlar[firstH].rang; }

            const raqam = Math.floor(100000 + Math.random() * 900000).toString();
            const kod5 = await generateKod5();
            const shtrixKod = 'UZ' + Date.now().toString().slice(-8) + Math.floor(10 + Math.random()*90);

            let items = []; let jami = 0; let birinchiRasm = '';
            for (let key of selectedKeys) {
                const it = savat[key];
                const mId = it.mahsulotId || key.split('_')[0];
                const m = mahsulotlar[mId];
                const imgs = getProductImages(m);
                let itemRasm = imgs[0] || '';
                if (it.tanlanganVariantlar && m.xususiyatlar) {
                    for (let xi in it.tanlanganVariantlar) {
                        const x = m.xususiyatlar[xi]; if (!x) continue;
                        const parsed = parseVariantlar(x.variantlar);
                        const f = parsed.find(v => v.nomi === it.tanlanganVariantlar[xi]);
                        if (f && f.rasmUrl) { itemRasm = f.rasmUrl; break; }
                    }
                }
                items.push({
                    mahsulotId: mId,
                    mahsulotNomi: m.nomi,
                    mahsulotRasm: itemRasm,
                    soni: it.soni,
                    narx: it.narx,
                    jami: it.narx * it.soni,
                    turi: m.turi || 'oddiy',
                    variantlar: it.variantlar || '',
                    tanlanganVariantlar: it.tanlanganVariantlar || {}
                });
                jami += it.narx * it.soni;
                if (!birinchiRasm && itemRasm) birinchiRasm = itemRasm;
                await decreaseVariantStock(mId, it.tanlanganVariantlar || {}, it.soni);
            }
            CACHE.mahsulotlar = null;

            const yeni = {
                id: raqam, userId: user.id, userRole: user.role,
                items, jami, tel, manzil, izoh, qiymatlar: data,
                mahsulotNomi: items.map(i => i.mahsulotNomi).join(', '),
                mahsulotRasm: birinchiRasm,
                sana: new Date().toISOString(),
                holat: defHolat, holatRangi: defRangi,
                javob: '', korinsin: true,
                kod5, shtrixKod
            };
            await set(ref(db, `buyurtmalar/${raqam}`), yeni);
            CACHE.buyurtmalar = null;

            for (let key of selectedKeys) { delete savat[key]; delete savatSelected[key]; }
            saveSavat(); saveSavatSelected(); closeModal();
            renderBuyurtmaTabrik(document.getElementById('tabContent'), yeni);
        }

        async function generateKod5() {
            for (let i = 0; i < 30; i++) {
                const code = Math.floor(10000 + Math.random() * 90000).toString();
                const s = await get(ref(db, `kodlar/${code}`));
                if (!s.exists()) { await set(ref(db, `kodlar/${code}`), true); return code; }
            }
            return Date.now().toString().slice(-5);
        }

                    let kod5Html = showKod5 ? `<div class="text-center"><div class="text-[10px] uppercase font-bold text-amber-700">5 xonali kod</div><div class="text-xl font-extrabold text-amber-800 tracking-widest">${b.kod5 || '—'}</div></div>` : '';
                    let eslatmaHtml = eslatma ? `<div class="bg-yellow-50 border border-yellow-200 p-2 rounded-xl text-xs text-yellow-800"><i class="fa-regular fa-note-sticky mr-1"></i>${eslatma}</div>` : '';

                    let itemsListHtml = '';

                list.innerHTML = html;
                document.querySelectorAll('svg.ucv').forEach(svg => {

        window.userDeleteBuyurtma = async function(id) {
            const user = await getCurrentUser();
            const all = await getBuyurtmalarCached(true);
            const b0 = all[id];
            if (b0) {
                const holatlar = await getHolatlarCached(true);
                let holatData = null;
                for (let hKey in holatlar) { if (holatlar[hKey].yozuv === b0.holat) { holatData = holatlar[hKey]; break; } }
                const canDelete = holatData ? holatData.ochirishRuxsati !== false : true;
                if (!canDelete && user.role !== 'admin') { alert("Bu holatda o'chirish mumkin emas!"); return; }
            }
            if (!confirm("O'chirilsin?")) return;
            const bSnap = await get(ref(db, `buyurtmalar/${id}`));
            const b = bSnap.exists() ? bSnap.val() : null;
            if (b && b.items && b.items.length) {
                for (let it of b.items) {
                    if (!it.mahsulotId) continue;
                    if (it.tanlanganVariantlar) {
                        await restoreVariantStock(it.mahsulotId, it.tanlanganVariantlar, it.soni);
                    }
                }
            }
            await remove(ref(db, `buyurtmalar/${id}`));
            CACHE.buyurtmalar = null; CACHE.mahsulotlar = null;
            renderBuyurtmalarim(document.getElementById('tabContent'));
        };

            window._uebAddProduct = function() {
                const mId = document.getElementById('uebNewProduct').value;
                if (!mId) { alert("Mahsulot tanlang!"); return; }
                const qty = parseInt(document.getElementById('uebNewProductQty').value) || 1;
                if (qty < 1) { alert("Soni 1 dan katta bo'lishi kerak!"); return; }
                const m = mahsulotlar[mId];
                if (!m) return;
                const maxSoni = parseInt(m.soni) || 0;
                const existingIdx = editItems.findIndex(it => it.mahsulotId === mId && !it.variantlar);
                if (existingIdx >= 0) {
                    const newQty = (parseInt(editItems[existingIdx].soni) || 0) + qty;
                    if (newQty > maxSoni) { alert(`Omborda yetarli emas! (mavjud: ${maxSoni})`); return; }
                    editItems[existingIdx].soni = newQty;
                    editItems[existingIdx].jami = (parseInt(editItems[existingIdx].narx) || 0) * newQty;
                } else {
                    if (qty > maxSoni) { alert(`Omborda yetarli emas! (mavjud: ${maxSoni})`); return; }

                    editItems.push({

                        mahsulotNomi: m.nomi,
                        mahsulotRasm: imgs[0] || '',
                        soni: qty,

                        <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                            <input type="number" id="yangiMahsulotNarx" placeholder="Narx (so'm) *" class="border-2 border-purple-200 px-4 py-3 rounded-2xl bg-white">

                        </div>

                            <div><label class="text-xs text-gray-500 font-bold">Shtrix kod (avto)</label><input type="text" id="yangiMahsulotShtrix" placeholder="Avtomatik" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl bg-white text-xs"></div>

            document.getElementById('addXususiyatBtn').addEventListener('click', () => {

                `;
                div.querySelector('.remove-xus').addEventListener('click', () => div.remove());
                const vlist = div.querySelector('.variants-list');
                let vIdx = 0;
                div.querySelector('.add-variant-btn').addEventListener('click', () => {
                    const wrap = document.createElement('div');
                    wrap.innerHTML = variantRowHtml('new', 0, vIdx++, {});
                    const row = wrap.firstElementChild;
                    row.querySelector('.remove-variant').addEventListener('click', () => row.remove());
                    row.querySelector('.v-rasm-file').addEventListener('change', async (e) => {
                        if (e.target.files[0]) {
                            const b64 = await readFileCompressed(e.target.files[0], 300, 300, 0.8);

            function getXususiyatlarData() {
                const list = document.getElementById('xususiyatList');
                const items = list.querySelectorAll('.xus-item');
                const result = [];
                items.forEach(div => {
                    const nomi = div.querySelector('.xus-nomi')?.value.trim();
                    if (!nomi) return;
                    const variants = [];
                    div.querySelectorAll('.variant-row').forEach(row => {
                        const vNomi = row.querySelector('.v-nomi')?.value.trim();
                        if (!vNomi) return;
                        const vNarx = parseInt(row.querySelector('.v-narx')?.value) || 0;
                        const vSoniRaw = row.querySelector('.v-soni')?.value;
                        const vSoni = (vSoniRaw === '' || vSoniRaw === null || vSoniRaw === undefined) ? null : (parseInt(vSoniRaw) || 0);
                        const vRasm = row.dataset.rasmUrl || (row.querySelector('.v-rasm-preview img')?.src || '');
                        variants.push({ nomi: vNomi, narx: vNarx, soni: vSoni, rasmUrl: vRasm });
                    });
                    if (variants.length) result.push({ nomi, variantlar: serializeVariantlar(variants) });
                });
                return result;

                document.getElementById('yangiMahsulotChegirma').value = '';
                document.getElementById('yangiMahsulotSoni').value = '1';

                document.getElementById('yangiMahsulotKod5').value = '';
                document.getElementById('yangiMahsulotShtrix').value = '';
                document.getElementById('xususiyatList').innerHTML = '';
                btn.disabled = false; btn.innerText = "Qo'shish";

                    alert("Bazaga saqlashda xatolik: " + err.message);

                    drawMahsulotlarList();

                            <div><label class="text-xs font-bold text-gray-700 uppercase">Chegirma %</label><input type="number" id="editMahsulotChegirma" value="${m.chegirma || ''}" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl"></div>

                            <div class="bg-indigo-50 p-4 rounded-3xl border-2 border-indigo-200 space-y-2">

                                <input type="text" id="editMahsulotShtrix" value="${m.shtrixKod || ''}" class="w-full border-2 border-indigo-300 rounded-2xl py-2 px-3 bg-white text-sm font-bold">
                                <div class="bg-white p-2 rounded-xl border flex justify-center min-h-[60px] items-center">
                                    <svg id="editMahsulotShtrixSvg"></svg>
                                </div>
                                <div class="flex gap-2">
                                    <button type="button" onclick="saveMahsulotShtrix('${mId}')" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold text-xs shadow hover:bg-emerald-700"><i class="fa-solid fa-floppy-disk mr-1"></i>Saqlash</button>
                                    <button type="button" onclick="regenerateMahsulotShtrix('${mId}')" class="flex-1 bg-blue-600 text-white py-2 rounded-xl font-bold text-xs shadow hover:bg-blue-700"><i class="fa-solid fa-rotate mr-1"></i>Qayta</button>
                                    <button type="button" onclick="deleteMahsulotShtrix('${mId}')" class="flex-1 bg-red-600 text-white py-2 rounded-xl font-bold text-xs shadow hover:bg-red-700"><i class="fa-solid fa-trash mr-1"></i>O'chirish</button>

                            <label class="text-xs font-bold text-gray-700 uppercase">Asosiy rasmlar</label>

                                ${imgs.map((u,i) => `<div class="relative border rounded-xl overflow-hidden"><img src="${u}" class="w-full h-24 object-contain bg-gray-50 img-thumb" onclick="openImageViewer(${JSON.stringify(imgs).replace(/"/g,'&quot;')},${i})"><button onclick="removeMahsulotRasm('${mId}',${i})" class="absolute top-1 right-1 bg-red-500 text-white w-6 h-6 rounded-full text-xs font-bold">&times;</button></div>`).join('') || '<p class="text-xs text-gray-400 col-span-3">Rasm yo\'q</p>'}

                    </div>
                </div>
            `;

            function bindVariantRow(row) {
                const fileInput = row.querySelector('.v-rasm-file');
                if (fileInput) {
                    fileInput.addEventListener('change', async (e) => {
                        if (e.target.files[0]) {
                            const b64 = await readFileCompressed(e.target.files[0], 300, 300, 0.8);
                            row.querySelector('.v-rasm-preview').innerHTML = `<img src="${b64}" class="w-full h-full object-contain">`;
                            row.dataset.rasmUrl = b64;
                        }
                    });
                }
                const rmBtn = row.querySelector('.remove-variant');
                if (rmBtn) rmBtn.addEventListener('click', () => row.remove());
            }

            modal.querySelectorAll('.xus-item').forEach(xusDiv => {
                const rmXus = xusDiv.querySelector('.remove-xus');
                if (rmXus) rmXus.addEventListener('click', () => xusDiv.remove());
                const addVarBtn = xusDiv.querySelector('.add-variant-btn');
                if (addVarBtn) addVarBtn.addEventListener('click', () => {
                    const vlist = xusDiv.querySelector('.variants-list');
                    const wrap = document.createElement('div');
                    wrap.innerHTML = editVariantRowHtml(0, 0, {});
                    const row = wrap.firstElementChild;
                    bindVariantRow(row);
                    vlist.appendChild(row);
                });
                xusDiv.querySelectorAll('.variant-row').forEach(bindVariantRow);
            });

            document.getElementById('editAddXususiyatBtn').addEventListener('click', () => {
                const list = document.getElementById('editXususiyatList');
                const div = document.createElement('div');
                div.className = 'xus-item bg-indigo-50/50 p-3 rounded-2xl border-2 border-indigo-200 space-y-2';
                div.innerHTML = `
                    <div class="flex gap-2 items-center">
                        <input type="text" placeholder="Xususiyat nomi" class="xus-nomi border-2 border-indigo-200 px-3 py-2 rounded-xl text-sm flex-1">
                        <button type="button" class="remove-xus text-red-500 font-bold px-2">&times;</button>
                    </div>
                    <div class="variants-list space-y-2"></div>
                    <button type="button" class="add-variant-btn text-xs bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-xl font-bold hover:bg-emerald-200"><i class="fa-solid fa-plus mr-1"></i>Variant qo'shish</button>
                `;
                div.querySelector('.remove-xus').addEventListener('click', () => div.remove());
                const vlist = div.querySelector('.variants-list');
                div.querySelector('.add-variant-btn').addEventListener('click', () => {
                    const wrap = document.createElement('div');
                    wrap.innerHTML = editVariantRowHtml(0, 0, {});
                    const row = wrap.firstElementChild;
                    bindVariantRow(row);
                    vlist.appendChild(row);
                });
                list.appendChild(div);
                div.querySelector('.add-variant-btn').click();
            });

            try {
                if (m.shtrixKod) {
                    JsBarcode("#editMahsulotShtrixSvg", m.shtrixKod, { format: "CODE128", width: 1.5, height: 50, fontSize: 12 });
                } else {
                    JsBarcode("#editMahsulotShtrixSvg", mId, { format: "CODE128", width: 1.5, height: 50, fontSize: 12 });
                }
            } catch(e) {}
        };

        // ==================== MAHSULOT KODLARINI BOSHQARISH ====================
        window.saveMahsulotKod5 = async function(mId) {
            const val = document.getElementById('editMahsulotKod5').value.trim();
            if (!/^\d{5}$/.test(val)) { alert("5 xonali raqam kiriting!"); return; }
            await update(ref(db, `mahsulotlar/${mId}`), { kod5: val });
            CACHE.mahsulotlar = null;
            showToast("5 xonali kod saqlandi!");
        };

        window.regenerateMahsulotKod5 = async function(mId) {
            const newCode = await generateKod5();
            document.getElementById('editMahsulotKod5').value = newCode;
            await update(ref(db, `mahsulotlar/${mId}`), { kod5: newCode });
            CACHE.mahsulotlar = null;
            showToast("Yangi kod: " + newCode);
        };

        window.deleteMahsulotKod5 = async function(mId) {
            if (!confirm("5 xonali kod o'chirilsinmi?")) return;
            document.getElementById('editMahsulotKod5').value = '';
            await update(ref(db, `mahsulotlar/${mId}`), { kod5: '' });
            CACHE.mahsulotlar = null;
            showToast("O'chirildi!");
        };

        window.saveMahsulotShtrix = async function(mId) {
            const val = document.getElementById('editMahsulotShtrix').value.trim();
            if (!val) { alert("Shtrix kod kiriting!"); return; }
            await update(ref(db, `mahsulotlar/${mId}`), { shtrixKod: val });
            CACHE.mahsulotlar = null;
            try { JsBarcode("#editMahsulotShtrixSvg", val, { format: "CODE128", width: 1.5, height: 50, fontSize: 12 }); } catch(e) {}
            showToast("Shtrix kod saqlandi!");
        };

        window.regenerateMahsulotShtrix = async function(mId) {
            const newCode = 'MA' + Date.now().toString().slice(-8) + Math.floor(10 + Math.random()*90);
            document.getElementById('editMahsulotShtrix').value = newCode;
            await update(ref(db, `mahsulotlar/${mId}`), { shtrixKod: newCode });
            CACHE.mahsulotlar = null;
            try { JsBarcode("#editMahsulotShtrixSvg", newCode, { format: "CODE128", width: 1.5, height: 50, fontSize: 12 }); } catch(e) {}
            showToast("Yangi shtrix: " + newCode);
        };

        window.deleteMahsulotShtrix = async function(mId) {
            if (!confirm("Shtrix kod o'chirilsinmi?")) return;
            document.getElementById('editMahsulotShtrix').value = '';
            document.getElementById('editMahsulotShtrixSvg').innerHTML = '';
            await update(ref(db, `mahsulotlar/${mId}`), { shtrixKod: '' });
            CACHE.mahsulotlar = null;
            showToast("O'chirildi!");
        };

        window.removeMahsulotRasm = async function(mId, idx) {
            const m = (await getMahsulotlarCached(true))[mId];
            if (!m) return;
            const imgs = getProductImages(m);
            imgs.splice(idx, 1);

            CACHE.mahsulotlar[mId] = { ...m, rasmUrls: imgs, rasmUrl: imgs[0] || '' };
            closeModal();
            openEditMahsulotModal(mId);
            showToast("Rasm o'chirildi!");

            try {
                await update(ref(db, `mahsulotlar/${mId}`), { rasmUrls: imgs, rasmUrl: imgs[0] || '' });
            } catch (err) {
                alert("Xatolik: " + err.message);
                CACHE.mahsulotlar = null;
            }
        };

        window.saveEditedMahsulot = async function(mId) {
            const nomi = document.getElementById('editMahsulotNomi').value.trim();
            const tavsif = document.getElementById('editMahsulotTavsif').value.trim();
            const narx = document.getElementById('editMahsulotNarx').value.trim();
            const eskiNarx = document.getElementById('editMahsulotEskiNarx').value.trim();
            const chegirma = document.getElementById('editMahsulotChegirma').value.trim();
            const soni = document.getElementById('editMahsulotSoni').value.trim();
            const turi = document.getElementById('editMahsulotTuri').value;
            const rasmInput = document.getElementById('editMahsulotRasm');
            let kod5 = document.getElementById('editMahsulotKod5').value.trim();
            let shtrixKod = document.getElementById('editMahsulotShtrix').value.trim();

            if (!nomi) { alert("Nomi kiriting!"); return; }

            if (!kod5) kod5 = await generateKod5();
            if (!shtrixKod) shtrixKod = 'MA' + Date.now().toString().slice(-8) + Math.floor(10 + Math.random()*90);

            const mahsulotlar = await getMahsulotlarCached(true);
            const eski = mahsulotlar[mId] || {};
            let rasmUrls = getProductImages(eski);

            if (rasmInput.files && rasmInput.files.length) {
                const yangiRasmlar = await readFilesCompressed(rasmInput.files);
                rasmUrls = rasmUrls.concat(yangiRasmlar);
            }

            const xususiyatlar = [];
            document.querySelectorAll('.xus-item').forEach(xusDiv => {
                const n = xusDiv.querySelector('.xus-nomi')?.value.trim();
                if (!n) return;
                const variants = [];
                xusDiv.querySelectorAll('.variant-row').forEach(row => {
                    const vNomi = row.querySelector('.v-nomi')?.value.trim();
                    if (!vNomi) return;
                    const vNarx = parseInt(row.querySelector('.v-narx')?.value) || 0;
                    const vSoniRaw = row.querySelector('.v-soni')?.value;
                    const vSoni = (vSoniRaw === '' || vSoniRaw === null || vSoniRaw === undefined) ? null : (parseInt(vSoniRaw) || 0);
                    const vRasm = row.dataset.rasmUrl || (row.querySelector('.v-rasm-preview img')?.src || '');
                    variants.push({ nomi: vNomi, narx: vNarx, soni: vSoni, rasmUrl: vRasm });
                });
                if (variants.length) xususiyatlar.push({ nomi: n, variantlar: serializeVariantlar(variants) });
            });

            const yangilangan = {
                nomi, tavsif, narx, eskiNarx, chegirma,
                soni: parseInt(soni) || 0, turi,
                rasmUrls, rasmUrl: rasmUrls[0] || '',
                xususiyatlar: xususiyatlar,
                kod5, shtrixKod
            };

            CACHE.mahsulotlar[mId] = { ...eski, ...yangilangan };
            closeModal();
            renderAdminMahsulotlar(document.getElementById('tabContent'));
            showToast("Saqlandi!");

            try {
                await update(ref(db, `mahsulotlar/${mId}`), yangilangan);
            } catch (err) {
                alert("Saqlashda xatolik: " + err.message);
                CACHE.mahsulotlar = null;
                renderAdminMahsulotlar(document.getElementById('tabContent'));
            }
        };

        window.deleteMahsulot = async function(mId) {
            if (!confirm("O'chirilsin?")) return;
            if (CACHE.mahsulotlar) delete CACHE.mahsulotlar[mId];
            renderAdminMahsulotlar(document.getElementById('tabContent'));
            showToast("O'chirildi!");
            try {
                await remove(ref(db, `mahsulotlar/${mId}`));
            } catch (err) {
                alert("O'chirishda xatolik: " + err.message);
                CACHE.mahsulotlar = null;
                renderAdminMahsulotlar(document.getElementById('tabContent'));
            }
        };

        // ==================== ADMIN: FIKRLAR ====================
        async function renderAdminFikrlar(container) {
            const fikrlar = await getFikrlarCached(true);
            const mahsulotlar = await getMahsulotlarCached(true);
            let html = `
                <div class="bg-white/70 backdrop-blur-sm p-6 rounded-3xl shadow-sm border border-pink-100 space-y-6">
                    <div><h2 class="text-2xl font-bold text-gray-800"><i class="fa-regular fa-comment-dots text-pink-500 mr-3"></i>Fikrlar boshqaruvi</h2><p class="text-sm text-gray-500">Mahsulotlar bo'yicha fikrlar va admin javoblari</p></div>
                    <div class="space-y-4">
            `;
            let found = false;
            for (let mId in fikrlar) {
                const m = mahsulotlar[mId] || { nomi: 'Noma\'lum mahsulot' };
                const list = fikrlar[mId] || {};
                let fCount = 0;
                let fListHtml = '';
                for (let fId in list) {
                    const f = list[fId]; fCount++;
                    let fMedia = '';
                    if (f.rasmUrl) fMedia += `<img src="${f.rasmUrl}" class="w-16 h-16 object-cover rounded-xl border mt-1 cursor-pointer" onclick="event.stopPropagation();openImageViewer(['${f.rasmUrl}'],0)">`;
                    fListHtml += `
                        <div class="border p-3 rounded-2xl bg-white space-y-2">
                            <div class="flex justify-between items-start">
                                <div><span class="text-xs font-bold text-gray-700">User: ${f.userId}</span><p class="text-xs text-gray-600 mt-1">${f.matn}</p>${fMedia}</div>
                                <span class="text-[10px] text-gray-400">${f.sana || ''}</span>
                            </div>
                            <div class="flex gap-2">
                                <input type="text" id="adminJavob_${mId}_${fId}" value="${f.adminJavob || ''}" placeholder="Admin javobi..." class="flex-1 border-2 border-pink-200 px-3 py-1.5 rounded-xl text-xs">
                                <button onclick="saveAdminFikrJavob('${mId}','${fId}')" class="bg-pink-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">Saqlash</button>
                                <button onclick="deleteFikrAdmin('${mId}','${fId}')" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-xl text-xs font-bold"><i class="fa-regular fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                }
                if (fCount > 0) {
                    found = true;
                    html += `<div class="border p-4 rounded-3xl bg-gray-50 space-y-3"><h3 class="font-bold text-gray-800">${m.nomi} <span class="text-xs bg-pink-100 text-pink-700 px-2 py-0.5 rounded-full">${fCount} ta fikr</span></h3><div class="space-y-2">${fListHtml}</div></div>`;
                }
            }
            if (!found) html += `<p class="text-gray-400 text-center py-10">Hozircha fikrlar yo'q</p>`;
            html += `</div></div>`;
            container.innerHTML = html;
        }

        window.saveAdminFikrJavob = async function(mId, fId) {
            const val = document.getElementById(`adminJavob_${mId}_${fId}`).value.trim();
            await update(ref(db, `fikrlar/${mId}/${fId}`), { adminJavob: val });
            CACHE.fikrlar = null; alert("Javob saqlandi!");
        };

        window.deleteFikrAdmin = async function(mId, fId) {
            if (!confirm("Fikr o'chirilsinmi?")) return;
            await remove(ref(db, `fikrlar/${mId}/${fId}`));
            CACHE.fikrlar = null;
            renderAdminFikrlar(document.getElementById('tabContent'));
        };

        // ==================== ADMIN: BUYURTMALAR ====================
        async function renderAdminBuyurtmalar(container) {
            const buyurtmalar = await getBuyurtmalarCached(true);
            const holatlar = await getHolatlarCached(true);
            container.innerHTML = `

                    html += `

                                    ${canDelete ? `<button onclick="adminDeleteBuyurtma('${id}')" class="bg-red-50 text-red-600 px-3 py-1.5 rounded-2xl text-xs font-bold hover:bg-red-100"><i class="fa-regular fa-trash"></i></button>` : ''}
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-4 items-center bg-amber-50/60 p-3 rounded-2xl border border-amber-200">

                            </div>
                            <div class="flex justify-between items-center pt-2 border-t"><span class="font-bold">Jami:</span><span class="font-extrabold text-purple-700 text-lg">${(b.jami || 0).toLocaleString()} so'm</span></div>
                            <div class="pt-3 border-t space-y-2"><label class="block text-xs font-bold text-gray-700 uppercase">Javob:</label><textarea id="adminBuyurtmaJavob_${id}" rows="2" class="w-full border-2 border-purple-200 px-4 py-3 rounded-2xl text-sm bg-gray-50">${b.javob || ''}</textarea><button onclick="saveAdminBuyurtmaJavob('${id}')" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-5 py-2 rounded-2xl text-xs font-bold shadow hover:shadow-lg">Saqlash</button></div>
                        </div>
                    `;
                }
                if (!found) html = `<div class="text-center py-10 text-gray-400">Buyurtmalar yo‘q</div>`;
                list.innerHTML = html;
                document.querySelectorAll('svg.acv').forEach(svg => { try { JsBarcode(svg, svg.dataset.code, { format: "CODE128", width: 1.2, height: 44, fontSize: 10 }); } catch(e) {} });
            }
            draw();
            document.getElementById('adminBuyurtmaSearch').addEventListener('input', (e) => draw(e.target.value.trim()));
        }

        window.adminUpdateBuyurtmaHolat = async function(id, val) {
            const hSnap = await get(ref(db, 'holatlar')); const holatlar = hSnap.exists() ? hSnap.val() : {};
            let rang = 'background:#f3f4f6;color:#1f2937;';
            for (let hKey in holatlar) { if (holatlar[hKey].yozuv === val) { rang = holatlar[hKey].rang; break; } }
            await update(ref(db, `buyurtmalar/${id}`), { holat: val, holatRangi: rang });
            CACHE.buyurtmalar = null;
        };
        window.saveAdminBuyurtmaJavob = async function(id) {
            const val = document.getElementById(`adminBuyurtmaJavob_${id}`).value.trim();
            await update(ref(db, `buyurtmalar/${id}`), { javob: val });
            CACHE.buyurtmalar = null; alert("Javob saqlandi!");
        };
        window.adminDeleteBuyurtma = async function(id) {
            if (!confirm("O'chirilsin?")) return;
            const bSnap = await get(ref(db, `buyurtmalar/${id}`));
            const b = bSnap.exists() ? bSnap.val() : null;
            if (b && b.items && b.items.length) {
                for (let it of b.items) {
                    if (!it.mahsulotId) continue;
                    if (it.tanlanganVariantlar) {
                        await restoreVariantStock(it.mahsulotId, it.tanlanganVariantlar, it.soni);
                    }
                }
            }
            await remove(ref(db, `buyurtmalar/${id}`));
            CACHE.buyurtmalar = null; CACHE.mahsulotlar = null;
            renderAdminBuyurtmalar(document.getElementById('tabContent'));
        };

            const variantlar = document.getElementById('ebmVariant').value.trim();

        window.moveBuyurtmaMaydonUp = async function(mId) {
            const all = await getBuyurtmaMaydonlar(true); const entries = sortMaydonlar(all);
            const idx = entries.findIndex(([id]) => id === mId); if (idx <= 0) return;
            const [pId, pM] = entries[idx - 1]; const [cId, cM] = entries[idx];
            await update(ref(db, `buyurtmaMaydonlar/${pId}`), { tartib: cM.tartib || idx + 1 });
            await update(ref(db, `buyurtmaMaydonlar/${cId}`), { tartib: pM.tartib || idx });
            CACHE.buyurtmaMaydonlar = null; renderAdminBuyurtmaMaydonlar(document.getElementById('tabContent'));

        window.moveBuyurtmaMaydonDown = async function(mId) {
            const all = await getBuyurtmaMaydonlar(true); const entries = sortMaydonlar(all);

            await update(ref(db, `buyurtmaMaydonlar/${nId}`), { tartib: cM.tartib || idx + 1 });
            await update(ref(db, `buyurtmaMaydonlar/${cId}`), { tartib: nM.tartib || idx + 2 });
            CACHE.buyurtmaMaydonlar = null; renderAdminBuyurtmaMaydonlar(document.getElementById('tabContent'));

        async function renderAdminScan(container) {
            container.innerHTML = `

                        </div>
                    </div>

                        </div>
                    </div>
                    <div id="scanResult" class="space-y-4"></div>

                const allA = await getArizalarCached(true);

                renderScanResult(null, null, 'buyurtma');
            });
            document.getElementById('scanBarcode').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('scanBarcodeBtn').click(); });
            document.getElementById('scanKod5').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('scanKod5Btn').click(); });

            document.getElementById('scanImageFile').addEventListener('change', async (e) => {
                if (!e.target.files || !e.target.files[0]) return;
                try {
                    const html5QrCode = new Html5Qrcode("reader");
                    const result = await html5QrCode.scanFile(e.target.files[0], true);
                    playBeep(3, 1200, 100, 80);
                    document.getElementById('scanBarcode').value = result;
                    document.getElementById('scanBarcodeBtn').click();
                } catch (err) {
                    alert("Rasmda kod topilmadi yoki o'qib bo'lmadi.");
                }
            });

            let html5QrCode = null;
            document.getElementById('startScanBtn').addEventListener('click', async () => {
                if (html5QrCode) {
                    try { await html5QrCode.stop(); } catch(e) {}
                    html5QrCode = null;
                    document.getElementById('startScanBtn').innerText = "Kamerani yoqish";
                    document.getElementById('reader').innerHTML = '';
                    return;
                }
                try {
                    html5QrCode = new Html5Qrcode("reader");
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 150 } },
                        async (decodedText) => {
                            playBeep(3, 1200, 100, 80);
                            document.getElementById('scanBarcode').value = decodedText;
                            document.getElementById('scanBarcodeBtn').click();
                            if (html5QrCode) { await html5QrCode.stop(); html5QrCode = null; document.getElementById('startScanBtn').innerText = "Kamerani yoqish"; document.getElementById('reader').innerHTML = ''; }
                        },
                        (errorMessage) => {}
                    );
                    document.getElementById('startScanBtn').innerText = "Kamerani o'chirish";
                } catch (err) { alert("Kamerani yoqishda xatolik: " + err); }
            });

            document.getElementById('galleryScanBtn').addEventListener('click', () => {

        // ==================== ARIZA FORMI ====================

                const maydonlarEntries = sortMaydonlar(turlar[key]?.maydonlar);

                for (let [mId, m] of maydonlarEntries) {

                    else html += `<input type="file" data-fid="${mId}" data-ftype="file" data-req="${req}" class="ariza-field w-full px-4 py-3 border-2 border-indigo-200 rounded-2xl file-input" ${req ? 'required' : ''}>`;
                    html += `</div>`;

                div.innerHTML = html;

                    group.querySelectorAll('input[type="checkbox"]').forEach(cb => {

                            if (checked > max) { cb.checked = false; alert(`Ko'pi bilan ${max} ta tanlash mumkin!`); }

                    });

            document.getElementById('submitArizaBtn').addEventListener('click', async () => {
                const user = await getCurrentUser(); if (!user) return;
                const turKey = document.getElementById('selectArizaTuri').value; if (!turKey) return;
                const all = await getArizalarCached(true); let cnt = 0; for (let aId in all) { if (all[aId].userId === user.id && all[aId].turKey === turKey) cnt++; }
                const limit = parseInt(turlar[turKey].maxLimit) || 0; if (limit > 0 && cnt >= limit) { alert(`Limit tugagan (${limit})`); return; }
                const inputs = document.querySelectorAll('.ariza-field');
                const checkboxGroups = document.querySelectorAll('.ariza-field.checkbox-group');
                let data = {};
                for (let inp of inputs) {
                    if (inp.classList.contains('checkbox-group')) continue;
                    const fid = inp.dataset.fid, ftype = inp.dataset.ftype, req = inp.dataset.req === 'true';
                    if (['rasm','video','file','rasm_tushish','galereyadan'].includes(ftype)) {
                        if (inp.files && inp.files.length) {
                            let files = [];
                            for (let f of inp.files) {
                                try {
                                    if (ftype === 'video') {
                                        const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
                                        files.push({ nomi: f.name, url: b64 });
                                    } else {
                                        const b64 = await readFileCompressed(f, 900, 900, 0.78);
                                        files.push({ nomi: f.name, url: b64 });
                                    }
                                } catch(e) {}
                            }
                            data[fid] = { turi: ftype, multiple: files.length > 1 || inp.multiple, files, nomi: files[0]?.nomi || '', url: files[0]?.url || '' };
                        } else { if (req) { alert("Majburiy fayl maydoni!"); return; } data[fid] = { turi: ftype, multiple: false, files: [], nomi: "", url: "" }; }
                    } else {
                        if (req && !inp.value.trim()) { alert("Majburiy maydon!"); inp.focus(); return; }
                        data[fid] = { turi: ftype, qiymat: inp.value };

                for (let group of checkboxGroups) {

                    data[fid] = { turi: 'tanlov', multiple: true, qiymat: checked.join(', '), variants: checked };

                let defHolat = 'Kutilmoqda', defRangi = 'background:#fef3c7;color:#92400e;', defTahrir = true, defOchirish = true;
                const firstH = Object.keys(holatlar)[0]; if (firstH) { defHolat = holatlar[firstH].yozuv; defRangi = holatlar[firstH].rang; defTahrir = holatlar[firstH].tahrirlashRuxsati !== false; defOchirish = holatlar[firstH].ochirishRuxsati !== false; }
                const raqam = Math.floor(100000 + Math.random() * 900000).toString();

                renderTabrikNoma(container, yeni);
            });
        }
